name: CI Pipeline

on:
  pull_request:
    branches:
      - main

env:
  # engines + engine-strict require node >=15 <16 and npm >=7 <8 (Node 15 ships npm 7).
  NODE_VERSION: '15'

defaults:
  run:
    # package.json lives in the app folder, not at the repo root.
    working-directory: codebase/rdicidr-0.1.0

jobs:
  install:
    # pull_request.branches matches the BASE branch; gate on the PR's source branch here.
    # Downstream jobs are skipped through needs: when this one is skipped.
    if: startsWith(github.head_ref, 'feature-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - uses: actions/cache/save@v6
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('codebase/rdicidr-0.1.0/package-lock.json') }}

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v6
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('codebase/rdicidr-0.1.0/package-lock.json') }}
          fail-on-cache-miss: true
      - run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v6
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('codebase/rdicidr-0.1.0/package-lock.json') }}
          fail-on-cache-miss: true
      - run: CI=true npm run test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v6
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('codebase/rdicidr-0.1.0/package-lock.json') }}
          fail-on-cache-miss: true
      - run: npm run build
